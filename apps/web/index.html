<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HydroSense water quality monitor for Philippine milkfish larval rearing tanks."
    />
    <meta name="theme-color" content="#061c2c" />
    <title>HydroSense</title>
    <script>
      try {
        var theme = localStorage.getItem('hydrosense.theme');
        document.documentElement.dataset.theme = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch (error) {
        console.warn('Theme preference could not be loaded:', error);
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
